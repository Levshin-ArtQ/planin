<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Planin. Личный день на этом устройстве." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planin" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <title>Planin</title>
    <style>
      html, body { margin: 0; background: #f3f0e8; color: #1c1916; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #141311; color: #ece7df; }
      }
    </style>
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <div class="boot">Открываю Planin…</div>
    </div>
    <input id="import-file" class="sr-file" type="file" accept="application/json,.json" />
    <script src="js/day.js"></script>
    <script src="js/parse.js"></script>
    <script src="js/db.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
